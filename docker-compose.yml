services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next  # ビルドキャッシュをコンテナ側で保持
    environment:
      - WATCHPACK_POLLING=true
      - NEXT_TELEMETRY_DISABLED=1
      # 開発モードを明示的に指定（たまに効きます）
      - NODE_ENV=development 

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      # バックエンドもホットリロード（tsx watchなど）を使っているならこれも有効
      - WATCHPACK_POLLING=true 
      - NODE_ENV=production  # 本番環境であることを明示
    # バックエンドがDBを待つように設定
    depends_on:
      - db

  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=kintai_db
    # DBにPOLLINGは不要なので削除しました
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: