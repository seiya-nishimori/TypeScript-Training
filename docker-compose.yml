services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app:delegated
      - /app/node_modules
      - /app/.next
    environment:
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=500        # 100より負荷を抑えつつ検知を安定化
      - NEXT_TELEMETRY_DISABLED=1
      - NODE_ENV=development
      - NODE_OPTIONS=--max-old-space-size=2048 # メモリ不足によるクラッシュを防止
    restart: always                  # 落ちても自動で再起動する設定を追加

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app:delegated
      - /app/node_modules
    environment:
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - NODE_ENV=development
    depends_on:
      - db
    restart: always                  # バックエンドも安定のために追加

  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=kintai_db
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: always

volumes:
  db_data: