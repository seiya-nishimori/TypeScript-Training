services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next  # コンテナ内のビルドキャッシュを保持するために追加
    environment:
      - WATCHPACK_POLLING=true  # これがWindowsでのホットリロードの心臓部です
      - NEXT_TELEMETRY_DISABLED=1

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/node_modules

  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=kintai_db
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: